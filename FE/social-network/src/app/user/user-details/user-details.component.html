<app-users-popup [userFollowers]="usersFollowers" />

<section *ngIf="user">
  <div class="card-body">
    <div class="d-flex flex-column align-items-center text-center pt-4">
      <img *ngIf="user.profileImageUrl" [src]="'data:image/JPEG;base64,' + user.profileImageUrl"
        style="height:150px; object-fit:cover;" class="rounded-circle" />
      <img *ngIf="!user.profileImageUrl" src="assets/images/default-profile-image.PNG"
        style="height:150px; object-fit:cover;" class="rounded-circle" width="150" />
      <div class="mt-3">
        <div class="row">
          <h4 class="pr-4 d-inline-flex">{{user.userUserName}}</h4>
        </div>
        <div class="d-inline-flex">
          <p class="text-secondary">Posts: {{user.userPostsCount}}</p>
          <a (click)="loadUserFollowers(user.userId)" data-toggle="modal" data-target="#users-modal">
            <p class="user-followers text-secondary pl-3">Followers:
              {{user.userFollowersCount}}</p>
          </a>
          <a (click)="loadUserFollowings(user.userId)" data-toggle="modal" data-target="#users-modal">
            <p class="user-followers text-secondary pl-3">Followings:
              {{user.userFollowingsCount}}</p>
          </a>
        </div>
      </div>
      <div class="row description">
      </div>
    </div>
  </div>
  <hr />
  <section>
    <div id="gallery" *ngIf="posts">
      <div class="row">
        <div class="post-galley col-12 col-sm-6 col-md-4 mt-4 thumb" *ngFor="let post of  this.posts"
          routerLink="/posts/{{post.postId}}">
          <div class="card text-white position-relative">
            <a class="thumbnail">
              <img *ngIf="post.images && post.images.length > 0"
                [src]="'data:image/JPEG;base64,' + post.images[0].imageUrl" style="height:320px; object-fit:cover;"
                class="card-img rounded opacity img-fluid z-depth-1" />
              <img *ngIf="!post.images || post.images.length === 0" src="assets/images/default-post-image.PNG"
                style="height:320px; object-fit:cover;" class="card-img rounded opacity img-fluid z-depth-1" />
              <div class="card-img-overlay d-flex justify-content-center align-items-center">
                <div class="d-flex align-items-center likes-container">
                  <i class="fa fa-heart likes"></i>
                  <div class="likes">{{ post.favoritesCount }}</div>
                </div>
              </div>
            </a>
          </div>

        </div>
      </div>
    </div>
    <app-global-loader *ngIf="user"/>
  </section>
</section>
